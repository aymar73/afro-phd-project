[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afro_phd"
version = "0.1.0"
authors = [{name = "Aymar Makanda", email = "aymar.makanda@afroproject.africa"}]
description = "Econometric analysis for a digital settlement currency for Africa."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter",
    "linearmodels",
    "scikit-learn"
]
